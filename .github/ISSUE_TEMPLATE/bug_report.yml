name: Bug report
description: Something in the library does not behave as documented.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        The smallest snippet that shows the problem. Include the pattern string
        and the seed — generated words are only reproducible with both.
      render: typescript
    validations:
      required: true
  - type: input
    id: pattern
    attributes:
      label: Pattern
      description: The pattern string involved, if the issue is pattern-specific.
      placeholder: cvccv
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 2.4.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: 22.11.0
    validations:
      required: true
